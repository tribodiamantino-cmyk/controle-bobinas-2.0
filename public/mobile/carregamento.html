<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6fa">
    <meta name="color-scheme" content="light only">
    <title>Carregamento - Controle de Bobinas</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Init Script -->
    <script src="js/init.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="mobile-header">
        <div class="d-flex align-items-center justify-content-between">
            <button class="btn btn-back" onclick="window.location.href='index.html'">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h1 class="flex-grow-1 text-center mb-0">📦 CARREGAMENTO</h1>
            <div>
                <button class="btn btn-back btn-sm" onclick="AppLogs.mostrarPainel()" title="Ver Logs">
                    <i class="bi bi-terminal"></i>
                </button>
                <button class="btn btn-back" onclick="carregamento.recarregar()" style="opacity: 0.8;">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mt-3 mb-5">
        <!-- TELA 1: Lista de PDCs Disponíveis -->
        <div id="listaView" style="display: none;">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h4 class="mb-3">PDCs Finalizados</h4>
                    <p class="text-muted mb-3">
                        <small>Selecione um PDC para iniciar o carregamento</small>
                    </p>
                    <div id="listaContainer">
                        <!-- Será preenchido via JS -->
                    </div>
                </div>
            </div>

            <!-- Histórico -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="mb-3">📜 Histórico</h5>
                    <button class="btn btn-outline-secondary w-100" onclick="carregamento.verHistorico()">
                        <i class="bi bi-clock-history"></i> Ver Carregamentos Anteriores
                    </button>
                </div>
            </div>
        </div>

        <!-- TELA 2: Validação de Cortes -->
        <div id="validacaoView" style="display: none;">
            <div class="mb-3">
                <button class="btn btn-outline-secondary btn-sm" onclick="carregamento.voltarParaLista()">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
            </div>

            <!-- Info do PDC -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h4 id="carregamentoPDC" class="mb-2"></h4>
                    <p id="carregamentoCliente" class="text-muted mb-3"></p>
                    
                    <!-- Locações -->
                    <div id="carregamentoLocacoes" class="mb-3">
                        <!-- Será preenchido via JS -->
                    </div>
                    
                    <!-- Progresso -->
                    <div class="progress-info">
                        <div class="progress-text">
                            <span id="progressoTexto">0/0 cortes validados</span>
                            <span id="progressoPercent">0%</span>
                        </div>
                        <div class="progress">
                            <div id="progressoBar" class="progress-bar bg-success" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scanner -->
            <div class="card shadow-sm mb-3">
                <div class="card-body text-center">
                    <h5 class="mb-3">📷 Escanear Cortes</h5>
                    <button class="btn btn-primary btn-lg btn-icon w-100" onclick="carregamento.escanearCorte()">
                        <i class="bi bi-qr-code-scan"></i>
                        <span>INICIAR SCANNER</span>
                    </button>
                </div>
            </div>

            <!-- Lista de Cortes -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="mb-3">📋 Lista de Cortes</h5>
                    <div id="listaCortes">
                        <p class="text-muted text-center">Carregando cortes...</p>
                    </div>
                </div>
            </div>

            <!-- Botão Finalizar -->
            <div id="finalizarSection" style="display: none;" class="mt-4">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i>
                    <strong>Todos cortes validados!</strong>
                </div>
                <button class="btn btn-success btn-lg w-100" onclick="carregamento.finalizar()">
                    <i class="bi bi-flag-fill"></i> FINALIZAR CARREGAMENTO
                </button>
            </div>
        </div>

        <!-- TELA 3: Sucesso -->
        <div id="sucessoView" style="display: none;">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="icon-xl text-success mb-4">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h2 class="mb-3">Carregamento Concluído!</h2>
                    <p id="sucessoPDC" class="text-muted mb-4"></p>
                    
                    <div class="alert alert-info mb-4">
                        <h5 id="sucessoTotal"></h5>
                        <p class="mb-0">Todos cortes validados e registrados</p>
                    </div>

                    <button class="btn btn-primary btn-lg w-100" onclick="carregamento.voltarParaLista()">
                        <i class="bi bi-arrow-left"></i> NOVO CARREGAMENTO
                    </button>
                </div>
            </div>
        </div>

        <!-- TELA 4: Histórico -->
        <div id="historicoView" style="display: none;">
            <div class="mb-3">
                <button class="btn btn-outline-secondary btn-sm" onclick="carregamento.voltarParaLista()">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-3">📜 Histórico de Carregamentos</h4>
                    <div id="historicoContainer">
                        <!-- Será preenchido via JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- Capacitor PRIMEIRO -->
    <script src="../capacitor.js"></script>
    <script src="js/capacitor-plugins.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/carregamento.js"></script>
</body>
</html>
