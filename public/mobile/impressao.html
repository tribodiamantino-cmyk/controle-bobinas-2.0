<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Central de Impressão - Bobinas App</title>
    
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="stylesheet" href="/mobile/styles.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button class="btn-voltar" onclick="window.location.href='/mobile/index.html'">
                ◀ Voltar
            </button>
            <h1>🖨️ Central de Impressão</h1>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="app-main">
        <!-- Passo 1: Escolher tipo de impressão -->
        <div id="passo-tipo" class="passo active">
            <div class="card">
                <h2>Escolha o tipo de etiqueta</h2>
                <div class="tipo-grid">
                    <button class="tipo-card" onclick="selecionarTipo('bobina')">
                        <div class="tipo-icon">📦</div>
                        <div class="tipo-nome">Bobina</div>
                        <div class="tipo-desc">Código: B-{id}</div>
                    </button>
                    
                    <button class="tipo-card" onclick="selecionarTipo('bobina')">
                        <div class="tipo-icon">🎯</div>
                        <div class="tipo-nome">Bobina</div>
                        <div class="tipo-desc">Código: BOB-0001</div>
                    </button>
                    
                    <button class="tipo-card" onclick="selecionarTipo('retalho')">
                        <div class="tipo-icon">♻️</div>
                        <div class="tipo-nome">Retalho</div>
                        <div class="tipo-desc">Código: RET-0001</div>
                    </button>
                    
                    <button class="tipo-card" onclick="selecionarTipo('corte')">
                        <div class="tipo-icon">✂️</div>
                        <div class="tipo-nome">Corte</div>
                        <div class="tipo-desc">COR-0001-PLA-0123</div>
                    </button>
                    
                    <button class="tipo-card" onclick="selecionarTipo('plano')">
                        <div class="tipo-icon">📋</div>
                        <div class="tipo-nome">Plano de Corte</div>
                        <div class="tipo-desc">Código: PLA-0001</div>
                    </button>
                    
                    <button class="tipo-card" onclick="selecionarTipo('localizacao')">
                        <div class="tipo-icon">📍</div>
                        <div class="tipo-nome">Localização</div>
                        <div class="tipo-desc">0001-A-0001</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Passo 2: Escanear código -->
        <div id="passo-scanner" class="passo">
            <div class="card">
                <h2>Código <span id="tipo-selecionado"></span></h2>
                
                <!-- Opção 1: Digitar Código -->
                <div style="margin-bottom: 30px; padding: 20px; background: #f0f9ff; border-radius: 8px; border: 2px solid #0ea5e9;">
                    <h3 style="margin: 0 0 15px 0; color: #0c4a6e; font-size: 16px;">
                        ⌨️ Digitar Código
                    </h3>
                    <input 
                        type="text" 
                        id="input-codigo" 
                        placeholder="Ex: BOB-0001, RET-0050, COR-0001-PLA-0123, PLA-0001 ou 0001-A-0001"
                        style="width: 100%; padding: 12px; font-size: 16px; border: 2px solid #0ea5e9; border-radius: 8px; text-transform: uppercase;"
                    />
                    <button 
                        class="btn btn-primary" 
                        onclick="buscarPorCodigoDigitado()"
                        style="width: 100%; margin-top: 10px; font-size: 16px; padding: 12px;">
                        🔍 Buscar e Gerar Etiqueta
                    </button>
                </div>
                
                <!-- Divisor -->
                <div style="text-align: center; margin: 20px 0; color: #94a3b8; font-weight: bold;">
                    ─── OU ───
                </div>
                
                <!-- Opção 2: Escanear QR -->
                <div style="padding: 20px; background: #f1f5f9; border-radius: 8px; border: 2px solid #64748b;">
                    <h3 style="margin: 0 0 15px 0; color: #1e293b; font-size: 16px;">
                        📱 Escanear QR Code
                    </h3>
                    <p style="margin: 0 0 15px 0; color: #475569; font-size: 14px;">
                        Apenas se a etiqueta já existe (reimprimir)
                    </p>
                    <div id="reader"></div>
                </div>
                
                <div style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="voltarParaTipos()">
                        ← Voltar
                    </button>
                </div>
            </div>
        </div>

        <!-- Passo 3: Preview e impressão -->
        <div id="passo-preview" class="passo">
            <div class="card">
                <h2>Preview da Etiqueta</h2>
                
                <div class="etiqueta-preview" id="etiqueta-preview">
                    <!-- Preview será inserido aqui -->
                </div>

                <div class="acoes-preview">
                    <button class="btn btn-secondary" onclick="voltarParaScanner()">
                        ← Escanear Outro
                    </button>
                    <button class="btn btn-primary" onclick="imprimirEtiqueta()">
                        🖨️ Imprimir
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="/mobile/impressao.js"></script>
</body>
</html>
