<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6fa">
    <meta name="color-scheme" content="light only">
    <title>Controle de Bobinas 2.0</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Init Script - DEVE VIR ANTES DE TUDO -->
    <script src="js/init.js"></script>
</head>
<body>
    <div class="menu-container">
        <header class="text-center py-4">
            <h1 class="display-4">🏭 Controle de Bobinas</h1>
            <p class="lead text-muted">Cortinave & BN</p>
            <small class="text-muted">v2.0.0</small>
        </header>

        <main class="container">
            <div class="row g-3 justify-content-center">
                <!-- CONSULTAS -->
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="consultas.html" class="menu-btn card shadow-sm text-decoration-none">
                        <div class="card-body text-center p-4">
                            <div class="icon-large mb-3">
                                <i class="bi bi-search"></i>
                            </div>
                            <h3 class="card-title">CONSULTAS</h3>
                            <p class="card-text text-muted">
                                Escanear códigos de barras e ver informações
                            </p>
                        </div>
                    </a>
                </div>

                <!-- PDC -->
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="pdc.html" class="menu-btn card shadow-sm text-decoration-none">
                        <div class="card-body text-center p-4">
                            <div class="icon-large mb-3">
                                <i class="bi bi-scissors"></i>
                            </div>
                            <h3 class="card-title">PDC</h3>
                            <p class="card-text text-muted">
                                Planos de Corte em produção
                            </p>
                        </div>
                    </a>
                </div>

                <!-- CARREGAMENTO -->
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="carregamento.html" class="menu-btn card shadow-sm text-decoration-none">
                        <div class="card-body text-center p-4">
                            <div class="icon-large mb-3">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <h3 class="card-title">CARREGAMENTO</h3>
                            <p class="card-text text-muted">
                                Validar cortes para envio
                            </p>
                        </div>
                    </a>
                </div>
            </div>
        </main>

        <footer class="text-center py-4 mt-5">
            <small class="text-muted">
                Sistema de Gestão de Estoque de Bobinas<br>
                Desenvolvido para Cortinave & BN
            </small>
        </footer>
    </div>

    <!-- Capacitor JS - ESSENCIAL PARA PLUGINS -->
    <script src="../capacitor.js"></script>
    <script src="js/capacitor-plugins.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
