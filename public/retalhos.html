<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retalhos - Controle de Bobinas</title>
    <link rel="stylesheet" href="css/style.css?v=1732632000">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>🎯 Retalhos</h1>
        </div>
        <div class="nav-menu">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="estoque.html">Estoque</a>
            <a href="ordens.html">Ordens de Corte</a>
            <a href="retalhos.html" class="active">Retalhos</a>
            <a href="configuracoes.html">⚙️ Config</a>
        </div>
    </nav>

    <div class="container">
        <!-- Filtros -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>🔍 Buscar:</label>
                <input type="text" id="busca" placeholder="Código, produto, localização, placa...">
            </div>
            <div class="filter-group">
                <label>📦 Produto:</label>
                <select id="filtroProduto">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🏪 Loja:</label>
                <select id="filtroLoja">
                    <option value="">Todas</option>
                    <option value="Cortinave">Cortinave</option>
                    <option value="BN">BN</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📏 Metragem:</label>
                <select id="filtroMetragem">
                    <option value="">Todas</option>
                    <option value="0-10">Até 10m</option>
                    <option value="10-30">10m - 30m</option>
                    <option value="30-50">30m - 50m</option>
                    <option value="50+">Acima de 50m</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📍 Status:</label>
                <select id="filtroStatus">
                    <option value="">Todos</option>
                    <option value="Disponível">Disponível</option>
                    <option value="Reservado">Reservado</option>
                    <option value="Usado">Usado</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📂 Origem:</label>
                <select id="filtroOrigem">
                    <option value="">Todas</option>
                    <option value="bobina">De Bobina</option>
                    <option value="corte">De Corte</option>
                    <option value="manual">Manual</option>
                </select>
            </div>
        </div>
        
        <div class="filter-bar" style="margin-top: 10px;">
            <div class="filter-group">
                <label>📅 Ordenar por:</label>
                <select id="ordenacao">
                    <option value="recentes">Mais Recentes</option>
                    <option value="antigos">Mais Antigos</option>
                    <option value="maior-metragem">Maior Metragem</option>
                    <option value="menor-metragem">Menor Metragem</option>
                    <option value="codigo">Código</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="limparFiltros()">🔄 Limpar Filtros</button>
            <button class="btn btn-primary" onclick="abrirModalNovoRetalho()">➕ Novo Retalho</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid" style="margin: 20px 0;">
            <div class="stat-card">
                <div class="stat-label">Total de Retalhos</div>
                <div class="stat-value" id="statTotal">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Metragem Total</div>
                <div class="stat-value" id="statMetragem">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Disponíveis</div>
                <div class="stat-value" id="statDisponiveis">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reservados</div>
                <div class="stat-value" id="statReservados">-</div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Metragem</th>
                        <th>Reservada</th>
                        <th>Placa</th>
                        <th>Localização</th>
                        <th>Origem</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaRetalhos">
                    <tr>
                        <td colspan="10" style="text-align: center; padding: 40px;">
                            Carregando retalhos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Novo Retalho -->
    <div id="modalNovoRetalho" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Novo Retalho Manual</h2>
                <button class="btn-close" onclick="fecharModalNovoRetalho()">✕</button>
            </div>
            <div class="modal-body">
                <form id="formNovoRetalho" onsubmit="event.preventDefault(); salvarNovoRetalho();">
                    <div class="form-group">
                        <label>Produto *</label>
                        <select id="produtoRetalho" class="form-control" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Metragem (m) *</label>
                        <input type="number" id="metragemRetalho" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Localização Atual</label>
                        <input type="text" id="localizacaoRetalho" class="form-control" placeholder="Ex: A1-B1-C1">
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="observacoesRetalho" class="form-control" rows="3"></textarea>
                    </div>
                    <div style="display: flex; gap: 12px; margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" onclick="fecharModalNovoRetalho()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Editar Retalho -->
    <div id="modalEditarRetalho" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Editar Retalho</h2>
                <button class="btn-close" onclick="fecharModalEditarRetalho()">✕</button>
            </div>
            <div class="modal-body">
                <form id="formEditarRetalho" onsubmit="event.preventDefault(); salvarEdicaoRetalho();">
                    <input type="hidden" id="editRetalhoId">
                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" id="editCodigo" class="form-control" disabled>
                    </div>
                    <div class="form-group">
                        <label>Metragem (m) *</label>
                        <input type="number" id="editMetragem" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Localização Atual</label>
                        <input type="text" id="editLocalizacao" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="editObservacoes" class="form-control" rows="3"></textarea>
                    </div>
                    <div style="display: flex; gap: 12px; margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" onclick="fecharModalEditarRetalho()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Imprimir Etiqueta -->
    <div id="modalImprimirEtiqueta" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>🖨️ Imprimir Etiqueta</h2>
                <button class="btn-close" onclick="fecharModalImprimirEtiqueta()">✕</button>
            </div>
            <div class="modal-body">
                <div id="previewEtiqueta" style="border: 2px solid #333; padding: 15px; background: white; margin-bottom: 20px;">
                    <!-- Preview da etiqueta será inserido aqui -->
                </div>
                <div style="display: flex; gap: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalImprimirEtiqueta()">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="confirmarImpressaoEtiqueta()">🖨️ Imprimir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="js/retalhos.js?v=1732632000"></script>
    <script src="/js/version-stamp.js"></script>
</body>
</html>
