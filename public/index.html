<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Bobinas</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .loader { text-align: center; color: white; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; margin: 0 0 10px; }
        p { font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1> Controle Bobinas</h1>
        <p>Carregando...</p>
    </div>
    <script>
        function isNativeApp() {
            return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        }
        if (isNativeApp()) {
            window.location.href = '/mobile/index.html';
        } else {
            window.location.href = '/index-web.html';
        }
    </script>
</body>
</html>
