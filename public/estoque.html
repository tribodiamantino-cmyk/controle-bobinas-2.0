<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Bobinas - Controle de Bobinas 2.0</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">🎯 Controle de Bobinas 2.0</a>
        <ul class="navbar-menu">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/produtos.html">Produtos</a></li>
            <li><a href="/estoque.html" class="active">Estoque</a></li>
            <li><a href="/ordens.html">Ordens</a></li>
            <li><a href="/retalhos.html">Retalhos</a></li>
            <li><a href="/templates.html">Obras Padrão</a></li>
            <li><a href="/etiquetas.html">🏷️ Etiquetas</a></li>
            <li><a href="/configuracoes.html">Config</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📦 Estoque de Bobinas</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary btn-lg" onclick="abrirModalNovaBobina()">
                    ➕ Nova Entrada de Bobina
                </button>
            </div>
        </div>
        
        <div id="alerta-container"></div>

        <!-- Lista de Produtos com Bobinas (Acordeão) -->
        <div class="card">
            <div class="card-header-compact">
                <h2>📊 Estoque Atual</h2>
                <button class="btn-toggle-filters" onclick="toggleFiltros()" id="btn-toggle-filters">
                    🔽 Mostrar Filtros
                </button>
            </div>
            
            <!-- Filtros Multi-Select (Colapsáveis) -->
            <div class="filter-container-compact" id="filter-container" style="display: none;">
                <div class="filter-grid">
                    <div class="form-group">
                        <label class="form-label">Loja</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-loja')">
                                <span id="filtro-estoque-loja-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-loja-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-loja-todas" value="" onchange="toggleSelectAll('filtro-estoque-loja')"> 
                                    <label for="filtro-estoque-loja-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-loja-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-status')">
                                <span id="filtro-estoque-status-label">Todos</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-status-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-status-todas" value="" onchange="toggleSelectAll('filtro-estoque-status')"> 
                                    <label for="filtro-estoque-status-todas">Todos</label>
                                </div>
                                <div id="filtro-estoque-status-opcoes">
                                    <div class="dropdown-item">
                                        <input type="checkbox" class="filtro-estoque-status-checkbox" value="Disponível" onchange="aplicarFiltrosEstoque('filtro-estoque-status')"> 
                                        <label>Disponível</label>
                                    </div>
                                    <div class="dropdown-item">
                                        <input type="checkbox" class="filtro-estoque-status-checkbox" value="Em uso" onchange="aplicarFiltrosEstoque('filtro-estoque-status')"> 
                                        <label>Em uso</label>
                                    </div>
                                    <div class="dropdown-item">
                                        <input type="checkbox" class="filtro-estoque-status-checkbox" value="Esgotada" onchange="aplicarFiltrosEstoque('filtro-estoque-status')"> 
                                        <label>Esgotada</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Cor</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-cor')">
                                <span id="filtro-estoque-cor-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-cor-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-cor-todas" value="" onchange="toggleSelectAll('filtro-estoque-cor')"> 
                                    <label for="filtro-estoque-cor-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-cor-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gramatura</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-gramatura')">
                                <span id="filtro-estoque-gramatura-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-gramatura-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-gramatura-todas" value="" onchange="toggleSelectAll('filtro-estoque-gramatura')"> 
                                    <label for="filtro-estoque-gramatura-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-gramatura-opcoes"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fabricante</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-fabricante')">
                                <span id="filtro-estoque-fabricante-label">Todos</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-fabricante-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-fabricante-todas" value="" onchange="toggleSelectAll('filtro-estoque-fabricante')"> 
                                    <label for="filtro-estoque-fabricante-todas">Todos</label>
                                </div>
                                <div id="filtro-estoque-fabricante-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo de Tecido</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-tipo')">
                                <span id="filtro-estoque-tipo-label">Todos</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-tipo-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-tipo-todas" value="" onchange="toggleSelectAll('filtro-estoque-tipo')"> 
                                    <label for="filtro-estoque-tipo-todas">Todos</label>
                                </div>
                                <div id="filtro-estoque-tipo-opcoes">
                                    <div class="dropdown-item">
                                        <input type="checkbox" class="filtro-estoque-tipo-checkbox" value="Normal" onchange="aplicarFiltrosEstoque('filtro-estoque-tipo')"> 
                                        <label>Normal</label>
                                    </div>
                                    <div class="dropdown-item">
                                        <input type="checkbox" class="filtro-estoque-tipo-checkbox" value="Bando Y" onchange="aplicarFiltrosEstoque('filtro-estoque-tipo')"> 
                                        <label>Bando Y</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo de Bainha</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-bainha')">
                                <span id="filtro-estoque-bainha-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-bainha-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-bainha-todas" value="" onchange="toggleSelectAll('filtro-estoque-bainha')"> 
                                    <label for="filtro-estoque-bainha-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-bainha-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Larg. S/Costura</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-larg-sem-costura')">
                                <span id="filtro-estoque-larg-sem-costura-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-larg-sem-costura-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-larg-sem-costura-todas" value="" onchange="toggleSelectAll('filtro-estoque-larg-sem-costura')"> 
                                    <label for="filtro-estoque-larg-sem-costura-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-larg-sem-costura-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Larg. Final</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-larg-final')">
                                <span id="filtro-estoque-larg-final-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-larg-final-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-larg-final-todas" value="" onchange="toggleSelectAll('filtro-estoque-larg-final')"> 
                                    <label for="filtro-estoque-larg-final-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-larg-final-opcoes"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Larg. Maior (Bando Y)</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-larg-maior')">
                                <span id="filtro-estoque-larg-maior-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-larg-maior-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-larg-maior-todas" value="" onchange="toggleSelectAll('filtro-estoque-larg-maior')"> 
                                    <label for="filtro-estoque-larg-maior-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-larg-maior-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Larg. Y (Bando Y)</label>
                        <div class="multi-select-dropdown">
                            <button type="button" class="btn-multi-select" onclick="toggleDropdown('filtro-estoque-larg-y')">
                                <span id="filtro-estoque-larg-y-label">Todas</span> ▼
                            </button>
                            <div class="dropdown-content" id="filtro-estoque-larg-y-dropdown">
                                <div class="dropdown-item">
                                    <input type="checkbox" id="filtro-estoque-larg-y-todas" value="" onchange="toggleSelectAll('filtro-estoque-larg-y')"> 
                                    <label for="filtro-estoque-larg-y-todas">Todas</label>
                                </div>
                                <div id="filtro-estoque-larg-y-opcoes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Busca Geral</label>
                        <input type="text" class="form-control" id="search-estoque" placeholder="🔍 Buscar por código, NF..." onkeyup="aplicarTodosFiltrosEstoque()">
                    </div>
                </div>
            </div>

            <div id="lista-produtos-estoque">
                <div class="text-center" style="padding: 40px;">
                    Carregando estoque...
                </div>
            </div>

            <div id="empty-estoque" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📦</div>
                <h3>Nenhuma bobina em estoque</h3>
                <p>Registre a primeira entrada acima</p>
            </div>
        </div>
    </div>

    <!-- Modal de Sucesso -->
    <div id="modal-sucesso" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>✅ Bobina Registrada com Sucesso!</h2>
            <div id="dados-bobina-criada"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="fecharModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal de cadastro de produto é criado dinamicamente pelo JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="/js/impressao-etiquetas.js"></script>
    <script src="/js/estoque.js"></script>
    <script src="/js/version-stamp.js"></script>
</body>
</html>
